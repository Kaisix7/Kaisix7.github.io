title: Karina Baitenova
first_name: Karina
middle_name:
last_name: Baitenova
navbar_title: Karina Baitenova
lang: en
description: >-
  Karina Baitenova studies software engineering and is exploring secure software
  development, vulnerability analysis, and software testing. She is preparing
  for graduate study in information security, software engineering, or applied AI.
keywords: "secure software engineering, application security, vulnerability analysis, DevSecOps, software testing, graduate research"
footer_text: ""
url: "https://kaisix7.github.io"
baseurl: ""
icon: "kb-favicon.svg"
last_updated: false
back_to_top: true

theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: "4.1.18"
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: true
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

profile:
  align: right
  image: prof_pic.jpg
  image_circular: true
  more_info: >-
    <p>Software Engineering</p>
    <p>Secure Software Systems</p>
    <p>Graduating in 2028</p>

socials:
  github: Kaisix7
  linkedin: karina-b-a022311b1x
  orcid: 0009-0003-4256-6862

